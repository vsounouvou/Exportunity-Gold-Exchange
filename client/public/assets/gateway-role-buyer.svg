<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Buyer role">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5D06A"/>
      <stop offset="100%" stop-color="#D4A83B"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D4A83B" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#D4A83B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>
  <rect width="900" height="600" fill="url(#glow)"/>

  <!-- Deal flow mark -->
  <g transform="translate(170 170)" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M60 260H480"/>
    <path d="M420 200L480 260L420 320"/>
    <rect x="60" y="90" width="220" height="110" rx="22"/>
    <path d="M120 140H220"/>
    <path d="M120 170H200"/>
  </g>

  <g opacity="0.22">
    <rect x="90" y="430" width="720" height="24" rx="12" fill="#CBD5E1"/>
    <rect x="90" y="468" width="520" height="16" rx="8" fill="#CBD5E1"/>
  </g>
</svg>
