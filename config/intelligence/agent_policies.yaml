version: 1
policies:
  - tier: SUPER
    max_context: -1
    max_reasoning_depth: 10
    max_token_budget_per_task: -1
    max_tasks_per_hour: -1
    allow_cross_tenant: true
    allow_llm: true
    notes: Strategic orchestration layer with global authority.
  - tier: MANAGER
    max_context: 16000
    max_reasoning_depth: 5
    max_token_budget_per_task: 8000
    max_tasks_per_hour: 40
    allow_cross_tenant: false
    allow_llm: true
    notes: Planning and validation layer constrained by tenant policy.
  - tier: EXECUTION
    max_context: 1200
    max_reasoning_depth: 1
    max_token_budget_per_task: 300
    max_tasks_per_hour: 500
    allow_cross_tenant: false
    allow_llm: false
    notes: Script-first deterministic layer. LLM calls are blocked by default.
