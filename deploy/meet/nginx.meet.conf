server {
  listen 80;
  server_name meet.exportunity.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name meet.exportunity.net;

  # Configure with your certificate paths
  ssl_certificate /etc/letsencrypt/live/meet.exportunity.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meet.exportunity.net/privkey.pem;

  client_max_body_size 1g;

  location / {
    proxy_pass http://meet-app:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /socket.io/ {
    proxy_pass http://meet-app:5000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
