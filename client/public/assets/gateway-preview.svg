<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Platform preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5D06A"/>
      <stop offset="100%" stop-color="#D4A83B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="150" y="140" width="1300" height="720" rx="26" fill="url(#card)" stroke="#1F2937" stroke-width="2"/>

    <!-- Sidebar -->
    <rect x="190" y="180" width="260" height="640" rx="18" fill="#0B1020" stroke="#1F2937" stroke-width="2"/>
    <rect x="220" y="220" width="200" height="14" rx="7" fill="#CBD5E1" opacity="0.25"/>
    <rect x="220" y="260" width="160" height="12" rx="6" fill="#CBD5E1" opacity="0.16"/>
    <rect x="220" y="290" width="190" height="12" rx="6" fill="#CBD5E1" opacity="0.14"/>
    <rect x="220" y="340" width="200" height="12" rx="6" fill="#CBD5E1" opacity="0.14"/>
    <rect x="220" y="370" width="180" height="12" rx="6" fill="#CBD5E1" opacity="0.12"/>
    <rect x="220" y="420" width="210" height="12" rx="6" fill="#CBD5E1" opacity="0.12"/>
    <rect x="220" y="450" width="170" height="12" rx="6" fill="#CBD5E1" opacity="0.10"/>

    <!-- Main header -->
    <rect x="480" y="180" width="930" height="60" rx="18" fill="#0B1020" stroke="#1F2937" stroke-width="2"/>
    <rect x="520" y="205" width="260" height="12" rx="6" fill="#CBD5E1" opacity="0.22"/>
    <rect x="1210" y="198" width="160" height="22" rx="11" fill="url(#gold)" opacity="0.45"/>

    <!-- Map panel -->
    <rect x="480" y="260" width="610" height="380" rx="22" fill="#070B14" stroke="#1F2937" stroke-width="2"/>
    <g opacity="0.22" stroke="#93C5FD" stroke-width="2" fill="none">
      <path d="M525 330C610 290 690 290 760 340C820 382 900 390 1030 338"/>
      <path d="M540 480C640 430 720 440 800 500C880 560 960 565 1040 520"/>
      <path d="M590 370C650 420 720 455 795 465C880 476 950 450 1015 410"/>
    </g>
    <g fill="#F5D06A" opacity="0.9">
      <circle cx="600" cy="360" r="6"/>
      <circle cx="740" cy="410" r="6"/>
      <circle cx="880" cy="460" r="6"/>
      <circle cx="1010" cy="420" r="6"/>
      <circle cx="660" cy="520" r="6"/>
      <circle cx="820" cy="545" r="6"/>
      <circle cx="980" cy="520" r="6"/>
    </g>

    <!-- KPI cards -->
    <rect x="1120" y="260" width="290" height="180" rx="22" fill="#070B14" stroke="#1F2937" stroke-width="2"/>
    <rect x="1148" y="294" width="180" height="14" rx="7" fill="#CBD5E1" opacity="0.20"/>
    <rect x="1148" y="330" width="240" height="40" rx="16" fill="url(#gold)" opacity="0.28"/>
    <rect x="1148" y="384" width="210" height="10" rx="5" fill="#CBD5E1" opacity="0.12"/>

    <rect x="1120" y="460" width="290" height="180" rx="22" fill="#070B14" stroke="#1F2937" stroke-width="2"/>
    <rect x="1148" y="494" width="160" height="14" rx="7" fill="#CBD5E1" opacity="0.20"/>
    <g opacity="0.35" stroke="url(#gold)" stroke-width="3" fill="none">
      <path d="M1150 600C1210 570 1260 590 1310 560C1360 530 1390 540 1400 520"/>
    </g>
  </g>
</svg>
