<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Bourse de l'Or gateway background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4A83B" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#D4A83B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4A83B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink" cx="18%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5D06A" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#F5D06A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5D06A" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#ink)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#93C5FD" stroke-width="1">
    <path d="M0 180H1920M0 360H1920M0 540H1920M0 720H1920M0 900H1920"/>
    <path d="M240 0V1080M480 0V1080M720 0V1080M960 0V1080M1200 0V1080M1440 0V1080M1680 0V1080"/>
  </g>

  <!-- Network lines on the right -->
  <g opacity="0.55" stroke="url(#goldLine)" stroke-width="2" fill="none">
    <path d="M1080 260C1220 210 1340 220 1480 310C1600 388 1690 430 1840 420"/>
    <path d="M1040 520C1190 470 1320 480 1460 570C1585 651 1700 710 1860 700"/>
    <path d="M1120 760C1250 700 1370 710 1510 790C1630 865 1720 905 1860 900"/>
    <path d="M1280 190C1320 320 1410 430 1540 520C1670 610 1750 700 1790 880"/>
    <path d="M1160 360C1290 420 1405 470 1500 560C1600 650 1670 760 1700 900"/>
  </g>

  <!-- Nodes -->
  <g fill="#F5D06A" opacity="0.9">
    <circle cx="1120" cy="760" r="6"/>
    <circle cx="1040" cy="520" r="6"/>
    <circle cx="1080" cy="260" r="6"/>
    <circle cx="1460" cy="570" r="6"/>
    <circle cx="1480" cy="310" r="6"/>
    <circle cx="1510" cy="790" r="6"/>
    <circle cx="1700" cy="900" r="6"/>
    <circle cx="1840" cy="420" r="6"/>
    <circle cx="1860" cy="700" r="6"/>
    <circle cx="1860" cy="900" r="6"/>
  </g>

  <!-- Soft gold bars hint -->
  <g opacity="0.22" filter="url(#soft)">
    <rect x="1420" y="180" width="260" height="70" rx="18" fill="#D4A83B"/>
    <rect x="1485" y="270" width="320" height="78" rx="18" fill="#D4A83B"/>
    <rect x="1385" y="370" width="420" height="84" rx="18" fill="#D4A83B"/>
  </g>
</svg>
