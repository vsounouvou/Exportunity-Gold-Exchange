<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1117" />
    <title>Reset Cache</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, #0b1220, transparent 55%),
          radial-gradient(circle at bottom right, #111827, transparent 55%),
          linear-gradient(135deg, #020617, #0b1117);
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .card {
        width: min(560px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 6px 0;
      }
      .sub {
        font-size: 12px;
        opacity: 0.75;
        margin: 0 0 14px 0;
        line-height: 1.4;
      }
      .log {
        font-size: 12px;
        opacity: 0.9;
        white-space: pre-wrap;
        line-height: 1.45;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        background: rgba(2, 6, 23, 0.55);
        max-height: 42vh;
        overflow: auto;
      }
      .hint {
        margin-top: 12px;
        font-size: 11px;
        opacity: 0.65;
      }
      a {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="title">Resetting cache…</p>
      <p class="sub">
        This clears Service Workers + Cache Storage + local/session storage, then reloads the app.
      </p>
      <div id="log" class="log">Starting…</div>
      <div class="hint">
        If you still see old UI after this, the frontend deploy did not update. Upload the latest
        <code>dist/public</code>.
      </div>
    </div>

    <script>
      (async () => {
        const logEl = document.getElementById("log");
        const log = (msg) => {
          try {
            logEl.textContent += `\n${msg}`;
          } catch {}
        };

        try {
          log("• Clearing local/session storage…");
          try {
            localStorage.clear();
            sessionStorage.clear();
          } catch {}

          if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
            log("• Unregistering Service Workers…");
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            log(`  Unregistered: ${regs.length}`);
          } else {
            log("• No Service Worker API available.");
          }

          if ("caches" in window && caches.keys) {
            log("• Deleting Cache Storage…");
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            log(`  Deleted caches: ${keys.length}`);
          } else {
            log("• No Cache Storage API available.");
          }
        } catch (err) {
          log(`! Reset error: ${String(err && err.message ? err.message : err)}`);
        } finally {
          log("• Reloading…");
          // Use replace to avoid trapping in back/forward history.
          const target = "/?cacheReset=1";
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
